{% extends "base.html" %}

{% block content %}

<h2>Online Examination</h2>

<form method="POST"
      action="{{ url_for('submit_exam') }}">

    {% for q in questions %}

    <div class="question">

        <h3>
            {{ loop.index }}. {{ q['question'] }}
        </h3>

        <label>
            <input type="radio"
                   name="question_{{ q['id'] }}"
                   value="A"
                   required>

            {{ q['option_a'] }}
        </label>

        <label>
            <input type="radio"
                   name="question_{{ q['id'] }}"
                   value="B">

            {{ q['option_b'] }}
        </label>

        <label>
            <input type="radio"
                   name="question_{{ q['id'] }}"
                   value="C">

            {{ q['option_c'] }}
        </label>

        <label>
            <input type="radio"
                   name="question_{{ q['id'] }}"
                   value="D">

            {{ q['option_d'] }}
        </label>

    </div>

    {% endfor %}

    <button type="submit">
        Submit Examination
    </button>

</form>

{% endblock %}
