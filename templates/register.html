{% extends "base.html" %}

{% block content %}

<h2>Student Registration</h2>

<form method="POST">

    <label>Full Name</label>

    <input type="text"
           name="name"
           required>

    <label>Email</label>

    <input type="email"
           name="email"
           required>

    <label>Password</label>

    <input type="password"
           name="password"
           required>

    <button type="submit">
        Register
    </button>

</form>

<p>
    Already registered?
    <a href="{{ url_for('login') }}">Login</a>
</p>

{% endblock %}
